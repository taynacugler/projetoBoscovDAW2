<app-menu></app-menu>

<div style="margin-top: 100px; display: flex; flex-direction: column; gap: 30px;">

<div *ngIf="tipoUsuario === 'ADM'" style="display: flex; justify-content: center;">
  <app-button label="Cadastrar Filme" (click)="acaoAdmin()"></app-button>
</div>
  <div *ngIf="(avaliacoes?.length || 0) > 0; else semAvaliacoes" style="display: flex; flex-direction: column; gap: 20px;">
    <ng-container *ngFor="let avaliacao of avaliacoes">
      <app-window-box [title]="'Avaliação de ' + (avaliacao.filme?.nome || 'Filme desconhecido')">
        <p>{{ avaliacao.comentario }}</p>
        <app-avaliacao-stars [nota]="avaliacao.nota" [readonly]="true"></app-avaliacao-stars>
      </app-window-box>
    </ng-container>
  </div>

  <ng-template #semAvaliacoes>
    <p style="text-align: center;">Nenhuma avaliação encontrada.</p>
  </ng-template>

</div>
