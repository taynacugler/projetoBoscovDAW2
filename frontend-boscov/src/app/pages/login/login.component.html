<div style="
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding-top: 60px;
  gap: 15px;
">

  <img src="BOSCOV.png" width="200" alt="Logo" style="display: flex; padding-top: 40px"/>

  <app-window-box title="LOGIN">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-input label="Email" [formControl]="email" type="email"></app-input>
      <app-input label="Senha" [formControl]="senha" type="password"></app-input>

      <div style="
        margin-top: 20px;
        display: flex;
        gap: 10px;
        justify-content: center; 
        align-items: center;">
        <app-button label="Entrar" tipo="submit" (click)="onSubmit()"></app-button>
        <app-button label="Ir para Cadastro" (click)="irParaCadastro()"></app-button>
      </div>
    </form>
  </app-window-box>

</div>
