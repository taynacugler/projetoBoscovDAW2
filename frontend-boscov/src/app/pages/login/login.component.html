<div style="
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  padding-top: 30px;
  gap: 1px;
">
  <img src="BOSCOV.png" width="250" alt="Logo" style="margin-bottom: 10px;" />
  <app-window-box title="LOGIN">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-input label="Email" [formControl]="email" type="email"></app-input>
      <app-input label="Senha" [formControl]="senha" type="password"></app-input>
      
      <div *ngIf="mensagemErro" class="mensagem erro">
        <strong>Erro:</strong> {{ mensagemErro }}
      </div>
      
      <div *ngIf="mensagemSucesso" class="mensagem sucesso">
        <strong>Sucesso:</strong> {{ mensagemSucesso }}
      </div>
      
      <div style="
        margin-top: 15px;
        display: flex;
        gap: 50px;
        justify-content: center;
        align-items: center;
      ">
        <app-button label="Entrar" tipo="submit"></app-button>
        <app-button label="Ir para Cadastro" (click)="irParaCadastro()" tipo="button"></app-button>
      </div>
    </form>
  </app-window-box>
</div>
