<app-menu></app-menu>

<div style="padding-top: 70px;"> <!-- Espaço para o menu fixo -->
  <app-window-box title="Nova Avaliação" class="form-container">

    <app-filme-list
      [filmes]="filmes"
      (filmeSelecionado)="onFilmeSelecionado($event)">
    </app-filme-list>

    <div *ngIf="filmeSelecionado" style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px;">

      <h3 style="margin: 0;">Filme: {{ filmeSelecionado?.nome }}</h3>

      <app-avaliacao-stars
        [nota]="nota"
        (notaChange)="nota = $event">
      </app-avaliacao-stars>

      <app-avaliacao-text
        [comentario]="comentario"
        (comentarioChange)="comentario = $event">
      </app-avaliacao-text>

      <div style="margin-top: 10px; display: flex; justify-content: flex-start;">
        <app-button label="Enviar" (click)="enviarAvaliacao()"></app-button>
      </div>

    </div>

  </app-window-box>
</div>
