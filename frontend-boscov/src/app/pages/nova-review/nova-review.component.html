<app-menu></app-menu>

<div style="padding-top: 70px;"> 
  <app-window-box title="Nova Avaliação" class="form-container">


    <div *ngIf="message.show" 
         class="message-container"
         [ngClass]="{
           'error-message': message.type === 'error',
           'success-message': message.type === 'success', 
           'warning-message': message.type === 'warning'
         }">
      <div class="message-content">
        <span class="message-icon" [innerHTML]="
          message.type === 'error' ? '⚠️' : 
          message.type === 'success' ? '✅' : '⚠️'
        "></span>
        <span class="message-text">{{ message.text }}</span>
        <button class="message-close" (click)="hideMessage()" title="Fechar">×</button>
      </div>
    </div>

 
    <div *ngIf="isLoadingFilmes" class="loading-container">
      <div class="loading-spinner"></div>
      <p class="loading-text">Carregando filmes...</p>
    </div>

  
    <div *ngIf="!isLoadingFilmes && !temFilmes && message.type === 'error'" class="empty-state">
      <div class="empty-state-content">
        <p class="empty-state-text">Não foi possível carregar os filmes.</p>
        <div class="button-wrapper" [ngClass]="{'button-disabled': isLoadingFilmes}">
          <app-button 
            label="Tentar Novamente" 
            (click)="!isLoadingFilmes ? recarregarFilmes() : null">
          </app-button>
        </div>
      </div>
    </div>


    <div *ngIf="!isLoadingFilmes && temFilmes">
      <app-filme-list
        [filmes]="filmes"
        (filmeSelecionado)="onFilmeSelecionado($event)">
      </app-filme-list>
    </div>


    <div *ngIf="filmeSelecionado" class="avaliacao-form">

      <h3 class="filme-selecionado">
        <span class="filme-label">Filme:</span> 
        <span class="filme-nome">{{ filmeSelecionado.nome }}</span>
      </h3>

      <div class="form-field">
        <label class="field-label">Sua nota:</label>
        <app-avaliacao-stars
          [nota]="nota"
          (notaChange)="nota = $event">
        </app-avaliacao-stars>
        <div *ngIf="nota === 0" class="field-hint">
          Clique nas estrelas para dar sua nota
        </div>
      </div>

      <div class="form-field">
        <label class="field-label">Seu comentário:</label>
        <app-avaliacao-text
          [comentario]="comentario"
          (comentarioChange)="comentario = $event">
        </app-avaliacao-text>
        <div class="character-count" 
             [ngClass]="{'count-warning': comentario.length > 450}">
          {{ comentario.length }}/500 caracteres
          <span *ngIf="comentario.trim().length < 10 && comentario.length > 0" class="count-error">
            (mínimo 10 caracteres)
          </span>
        </div>
      </div>

      <div class="form-actions">
        <div class="button-wrapper" [ngClass]="{'button-disabled': !podeEnviar}">
          <app-button 
            [label]="isEnviandoAvaliacao ? 'Enviando...' : 'Enviar Avaliação'"
            (click)="podeEnviar ? enviarAvaliacao() : null"
            [class.sending]="isEnviandoAvaliacao">
          </app-button>
        </div>
        
        <button *ngIf="!isEnviandoAvaliacao" 
                class="btn-secundario" 
                (click)="resetarFormulario()"
                type="button">
          Limpar
        </button>
      </div>

    </div>

    <div *ngIf="!filmeSelecionado && !isLoadingFilmes && temFilmes" class="select-movie-hint">
      <p>Selecione um filme acima para começar sua avaliação</p>
    </div>

  </app-window-box>
</div>
